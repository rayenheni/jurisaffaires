<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — JurisAffaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <a href="../index.html"><img src="../assets/img/logo-jurisaffaires-light.png" alt="JurisAffaires" width="210" height="35"></a>
      <span>Administration</span>
    </div>
    <nav class="sidebar__nav" id="nav">
      <!-- injected by JS -->
    </nav>
    <div class="sidebar__foot">
      <div class="user-box" id="userBox">
        <div><b id="userName">—</b><br><span id="userEmail">—</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <a href="../index.html" target="_blank" class="btn btn--ghost btn--sm" style="flex:1;background:transparent;color:var(--ivory);border-color:rgba(244,240,232,.18)">Voir le site</a>
        <button id="logoutBtn" class="btn btn--sm" style="background:rgba(244,240,232,.08);color:var(--ivory);border-color:rgba(244,240,232,.12)">Déconnexion</button>
      </div>
    </div>
  </aside>

  <div>
    <header class="topbar">
      <div style="display:flex;gap:12px;align-items:center">
        <button class="burger" id="burger" aria-label="Menu">☰</button>
        <h1 id="pageTitle">Tableau de bord</h1>
      </div>
      <div class="topbar__actions">
        <span id="rebuildStatus" class="kpi"></span>
        <button id="rebuildBtn" class="btn btn--gold btn--sm">⟳ Reconstruire le site</button>
        <button id="saveBtn" class="btn btn--primary btn--sm" style="display:none">Enregistrer</button>
      </div>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>

<script src="assets/admin.js"></script>
</body>
</html>
