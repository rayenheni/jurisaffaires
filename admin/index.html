<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — JurisAffaires</title>
<link rel="preload" href="../assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/admin.css?v=5">
</head>
<body>

<div id="loginScreen" class="login-body" hidden>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img src="../assets/img/logo-jurisaffaires.png" alt="JurisAffaires" width="200" height="33">
        <p>Espace d'administration</p>
      </div>
      <h1>Connexion</h1>
      <p class="muted">Accès réservé au cabinet.</p>
      <form id="loginForm" class="form-stack">
        <label>Email
          <input type="email" id="email" required autocomplete="username" placeholder="admin@jurisaffaires.tn" value="admin@jurisaffaires.tn">
        </label>
        <label>Mot de passe
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <div id="loginError" class="alert alert--error" hidden></div>
        <button type="submit" class="btn btn--primary btn--block" id="loginBtn">Se connecter</button>
        <p class="login-hint muted">Défaut : <code>admin@jurisaffaires.tn</code> / <code>Admin123!</code> — à changer après première connexion.</p>
      </form>
    </div>
    <div class="login-foot">
      <a href="../index.html">← Retour au site</a>
    </div>
  </div>
</div>

<div id="appShell" class="admin-layout" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <a href="../index.html"><img src="../assets/img/logo-jurisaffaires-light.png" alt="JurisAffaires" width="210" height="35"></a>
      <span>Administration</span>
    </div>
    <nav class="sidebar__nav" id="nav">
      <!-- injected by JS -->
    </nav>
    <div class="sidebar__foot">
      <div class="user-box" id="userBox">
        <div><b id="userName">—</b><br><span id="userEmail">—</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <a href="../index.html" target="_blank" class="btn btn--ghost btn--sm" style="flex:1;background:transparent;color:var(--ivory);border-color:rgba(244,240,232,.18)">Voir le site</a>
        <button id="logoutBtn" class="btn btn--sm" style="background:rgba(244,240,232,.08);color:var(--ivory);border-color:rgba(244,240,232,.12)">Déconnexion</button>
      </div>
    </div>
  </aside>

  <div>
    <header class="topbar">
      <div style="display:flex;gap:12px;align-items:center">
        <button class="burger" id="burger" aria-label="Menu">☰</button>
        <h1 id="pageTitle">Tableau de bord</h1>
      </div>
      <div class="topbar__actions">
        <span id="rebuildStatus" class="kpi"></span>
        <a href="../rendez-vous.html" target="_blank" class="btn btn--ghost btn--sm">↗ Page RDV</a>
        <button id="rebuildBtn" class="btn btn--gold btn--sm">⟳ Reconstruire le site</button>
        <button id="saveBtn" class="btn btn--primary btn--sm" style="display:none">Enregistrer</button>
      </div>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>

<script src="assets/admin.js?v=4"></script>
</body>
</html>
